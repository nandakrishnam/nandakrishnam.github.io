---
layout: default
---
<article class="post">
  <a class="back-link" href="/blog/">&larr; cd ~/blog</a>
  <header class="post-header">
    <p class="post-meta"><span class="accent">$</span> cat {{ page.url | split: "/" | last }}.md &middot; <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
    <h1>{{ page.title }}</h1>
    {% if page.tags %}<ul class="post-tags">{% for t in page.tags %}<li>#{{ t }}</li>{% endfor %}</ul>{% endif %}
  </header>
  <div class="post-body">
{{ content }}
  </div>
</article>
